<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Install, use, build and test the Aperture plugin for OpenCode.">
    <title>Aperture for OpenCode</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
    <style>
      :root { --theme-color: #235c45; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .markdown-section { max-width: 850px; }
      .markdown-section code { overflow-wrap: anywhere; }
      .sidebar .app-name { font-weight: 650; }
    </style>
  </head>
  <body>
    <div id="app">Loading Aperture documentation...</div>
    <noscript>This site needs JavaScript. Read the <a href="how-to-use.md">Markdown usage guide</a> instead.</noscript>
    <script>
      window.$docsify = {
        name: 'Aperture for OpenCode',
        repo: 'https://github.com/jaxxstorm/opencode-aperture',
        loadSidebar: true,
        homepage: 'README.md',
        notFoundPage: '_404.md',
        subMaxLevel: 2,
        auto2top: true,
        search: { paths: 'auto', placeholder: 'Search documentation', noData: 'No results.' }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  </body>
</html>
