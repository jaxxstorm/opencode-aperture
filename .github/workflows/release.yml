name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  identity:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Validate stable tag and package identity
        run: bun scripts/release.ts identity

  baseline:
    needs: identity
    uses: ./.github/workflows/verify.yml

  candidate:
    needs: [identity, baseline]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      OPENCODE_EXPECT_VERSION: "1.18.29"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Install pinned npm and OpenCode
        run: |
          npm install -g npm@11.5.1 --ignore-scripts --registry=https://registry.npmjs.org
          npm install -g opencode-ai@1.18.29 --registry=https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Resolve candidate identity
        run: bun scripts/release.ts identity
      - name: Locked install
        run: bun install --frozen-lockfile
      - name: Build and pack one candidate
        run: |
          mkdir release-artifacts
          bun run pack
          mv "$(basename "$APERTURE_TEST_TARBALL")" "$APERTURE_TEST_TARBALL"
          bun scripts/release.ts checksum
      - name: Inspect and load exact candidate
        run: bun run test:package
      - name: Route exact candidate
        run: bun run test:routing
      - name: Verify cleanup with exact candidate
        run: bun scripts/verify-probe-cleanup.ts
      - name: Verify unchanged bytes and report candidate
        run: |
          bun scripts/release.ts verify
          {
            printf '### Verified release candidate\n\n'
            printf 'Commit: %s\nTag: %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME"
            printf 'Bun: %s\nNode: %s\nnpm: %s\nOpenCode: %s\n' "$(bun --version)" "$(node --version)" "$(npm --version)" "$(opencode --version)"
            printf '\nSHA-256: '
            cat "$APERTURE_TEST_TARBALL.sha256"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [identity, baseline, candidate]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    # Owner setup: required approval; npm trust jaxxstorm/opencode-aperture,
    # release.yml, environment npm, with direct npm publish explicitly allowed.
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Install OIDC-capable pinned npm
        run: npm install -g npm@11.5.1 --ignore-scripts --registry=https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: release-artifacts
      - name: Resolve candidate identity
        run: bun scripts/release.ts identity
      - name: Verify downloaded candidate checksum
        run: bun scripts/release.ts verify
      - name: Reject existing versions and registry errors
        run: bun scripts/release.ts available
      - name: Report publishing toolchain
        run: |
          printf 'Publishing with Node %s, npm %s, Bun %s\n' "$(node --version)" "$(npm --version)" "$(bun --version)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish verified tarball with OIDC
        run: npm publish "$APERTURE_TEST_TARBALL" --ignore-scripts --access public --provenance --registry=https://registry.npmjs.org
      - name: Create GitHub release after npm success
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APERTURE_TEST_TARBALL" "$APERTURE_TEST_TARBALL.sha256" --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
